<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor de Excel</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    margin: 0;
}

header {
    background: #1e272e;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    padding: 15px;
}

.block {
    background: white;
    margin-bottom: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.block-header {
    background: #273c75;
    color: white;
    padding: 10px;
}

.task {
    padding: 10px;
    border-bottom: 1px solid #eee;
}

.pendente { color: red; }
.entregue { color: green; }

input[type="file"] {
    margin: 10px;
}
</style>
</head>

<body>

<header>
<h2>📊 Cronograma via Excel</h2>
</header>

<div class="container">

<input type="file" id="inputExcel" />

<div id="app"></div>

</div>

<script>

/////////////////////////////////////////////////////
// 📅 FUNÇÕES DE DATA
/////////////////////////////////////////////////////

function formatar(data) {
    return new Date(data).toLocaleDateString("pt-BR");
}

function separacao(data) {
    let d = new Date(data);
    d.setDate(d.getDate() - 7);

    let seg = new Date(d);
    let qua = new Date(d);

    seg.setDate(d.getDate() - d.getDay() + 1);
    qua.setDate(seg.getDate() + 2);

    return `${formatar(seg)} até ${formatar(qua)}`;
}

function entrega(data) {
    let d = new Date(data);
    d.setDate(d.getDate() - 7);

    let qui = new Date(d);
    let sex = new Date(d);

    qui.setDate(d.getDate() - d.getDay() + 4);
    sex.setDate(qui.getDate() + 1);

    return `${formatar(qui)} até ${formatar(sex)}`;
}

/////////////////////////////////////////////////////
// 📥 LEITURA DO EXCEL
/////////////////////////////////////////////////////

document.getElementById("inputExcel").addEventListener("change", function(e){

    const file = e.target.files[0];

    const reader = new FileReader();

    reader.onload = function(evt) {

        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, {type: "array"});

        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        montar(json);
    };

    reader.readAsArrayBuffer(file);

});

/////////////////////////////////////////////////////
// 🧠 ORGANIZAÇÃO AUTOMÁTICA
/////////////////////////////////////////////////////

function montar(dadosExcel) {

    let blocoAtual = "";
    let subAtual = "";

    let estrutura = {};

    dadosExcel.forEach(linha => {

        const nome = linha["Nome_da_Tarefa"];
        const inicio = linha["Data_Início"];

        // BLOCO
        if (nome && nome.includes("BLOCO")) {
            blocoAtual = nome;
            estrutura[blocoAtual] = {};
        }

        // SUBCATEGORIA (nível 2 geralmente)
        else if (linha["Nível_da_Estrutura_de_Tópicos"] == 2) {
            subAtual = nome;
            estrutura[blocoAtual][subAtual] = [];
        }

        // TAREFA
        else if (linha["Nível_da_Estrutura_de_Tópicos"] >= 3) {

            if (blocoAtual && subAtual) {
                estrutura[blocoAtual][subAtual].push({
                    nome,
                    inicio
                });
            }
        }

    });

    render(estrutura);
}

/////////////////////////////////////////////////////
// 🎯 RENDER
/////////////////////////////////////////////////////

function render(estrutura) {

    const app = document.getElementById("app");
    app.innerHTML = "";

    Object.keys(estrutura).forEach(bloco => {

        const blocoEl = document.createElement("div");
        blocoEl.className = "block";

        const header = document.createElement("div");
        header.className = "block-header";
        header.innerText = bloco;

        blocoEl.appendChild(header);

        Object.keys(estrutura[bloco]).forEach(sub => {

            const subEl = document.createElement("div");
            subEl.innerHTML = `<h4 style="margin-left:10px">${sub}</h4>`;

            estrutura[bloco][sub].forEach(task => {

                let inicio = task.inicio ? new Date(task.inicio) : null;

                const taskEl = document.createElement("div");
                taskEl.className = "task";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";

                const status = document.createElement("span");
                status.className = "pendente";
                status.innerText = " Pendente";

                checkbox.onchange = () => {
                    if (checkbox.checked) {
                        status.innerText = " Entregue";
                        status.className = "entregue";
                    } else {
                        status.innerText = " Pendente";
                        status.className = "pendente";
                    }
                };

                taskEl.appendChild(checkbox);

                taskEl.innerHTML += `
                    <strong>${task.nome}</strong><br>
                    📅 Início: ${inicio ? formatar(inicio) : "-"}<br>
                    📦 Separação: ${inicio ? separacao(inicio) : "-"}<br>
                    🚚 Entrega: ${inicio ? entrega(inicio) : "-"}
                `;

                taskEl.appendChild(status);

                subEl.appendChild(taskEl);

            });

            blocoEl.appendChild(subEl);
        });

        app.appendChild(blocoEl);
    });
}

</script>

</body>
</html>
