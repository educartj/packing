<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma Inteligente</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f9;
}

header {
    background: #1e272e;
    color: white;
    padding: 15px;
    text-align: center;
}

.filters {
    text-align: center;
    margin: 10px;
}

input {
    padding: 8px;
    margin: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.container {
    padding: 15px;
}

.block {
    background: white;
    margin-bottom: 15px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.block-header {
    background: #273c75;
    color: white;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
}

.subcategory {
    padding: 10px;
    border-top: 1px solid #eee;
}

.task {
    margin-left: 10px;
    padding: 6px;
    border-left: 3px solid #00a8ff;
    margin-bottom: 5px;
    font-size: 13px;
    display: flex;
    flex-direction: column;
}

.status {
    font-weight: bold;
}

.pendente {
    color: red;
}

.entregue {
    color: green;
}
</style>
</head>

<body>

<header>
<h2>📋 Cronograma Inteligente</h2>
</header>

<div class="filters">
    🔎 Buscar: <input type="text" id="search">
    📅 Data início: <input type="date" id="filtroData">
</div>

<div class="container" id="app"></div>

<script>

/////////////////////////////////////////////////////
// 🔥 DADOS (exemplo com DATA DE INÍCIO)
/////////////////////////////////////////////////////

const dados = [
{
  bloco: "BLOCO 20",
  subcategorias: [
    {
      nome: "PREPARAÇÃO DO CANTEIRO",
      tarefas: [
        { nome: "Instalação de água provisória", inicio: "2026-06-22" },
        { nome: "Instalação elétrica provisória", inicio: "2026-06-25" }
      ]
    }
  ]
}
];

/////////////////////////////////////////////////////
// 📅 FUNÇÕES DE DATA
/////////////////////////////////////////////////////

function formatarData(data) {
    return new Date(data).toLocaleDateString("pt-BR");
}

function getSeparacao(data) {
    const d = new Date(data);

    d.setDate(d.getDate() - 7);

    let segunda = new Date(d);
    let quarta = new Date(d);

    segunda.setDate(d.getDate() - d.getDay() + 1);
    quarta.setDate(segunda.getDate() + 2);

    return `${formatarData(segunda)} até ${formatarData(quarta)}`;
}

function getEntrega(data) {
    const d = new Date(data);

    d.setDate(d.getDate() - 7);

    let quinta = new Date(d);
    let sexta = new Date(d);

    quinta.setDate(d.getDate() - d.getDay() + 4);
    sexta.setDate(quinta.getDate() + 1);

    return `${formatarData(quinta)} até ${formatarData(sexta)}`;
}

/////////////////////////////////////////////////////
// 🎯 RENDER
/////////////////////////////////////////////////////

const app = document.getElementById("app");

function render(data) {

    app.innerHTML = "";

    data.forEach(bloco => {

        const blocoEl = document.createElement("div");
        blocoEl.className = "block";

        const header = document.createElement("div");
        header.className = "block-header";
        header.innerText = bloco.bloco;

        const content = document.createElement("div");

        header.onclick = () => {
            content.classList.toggle("hidden");
        };

        bloco.subcategorias.forEach(sub => {

            const subEl = document.createElement("div");
            subEl.className = "subcategory";

            const title = document.createElement("h4");
            title.innerText = sub.nome;
            subEl.appendChild(title);

            sub.tarefas.forEach(task => {

                const taskEl = document.createElement("div");
                taskEl.className = "task";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";

                const status = document.createElement("span");
                status.className = "status pendente";
                status.innerText = "Pendente";

                checkbox.onchange = () => {
                    if (checkbox.checked) {
                        status.innerText = "Entregue";
                        status.className = "status entregue";
                    } else {
                        status.innerText = "Pendente";
                        status.className = "status pendente";
                    }
                };

                taskEl.innerHTML = `
                    <strong>${task.nome}</strong><br>
                    📅 Início: ${formatarData(task.inicio)}<br>
                    📦 Separação: ${getSeparacao(task.inicio)}<br>
                    🚚 Entrega: ${getEntrega(task.inicio)}<br>
                `;

                taskEl.prepend(checkbox);
                taskEl.appendChild(status);

                subEl.appendChild(taskEl);
            });

            content.appendChild(subEl);
        });

        blocoEl.appendChild(header);
        blocoEl.appendChild(content);

        app.appendChild(blocoEl);
    });

}

render(dados);

/////////////////////////////////////////////////////
// 🔎 FILTROS
/////////////////////////////////////////////////////

document.getElementById("search").addEventListener("input", filtrar);
document.getElementById("filtroData").addEventListener("input", filtrar);

function filtrar() {

    const texto = document.getElementById("search").value.toLowerCase();
    const dataFiltro = document.getElementById("filtroData").value;

    const filtrado = dados.map(bloco => {

        return {
            bloco: bloco.bloco,
            subcategorias: bloco.subcategorias.map(sub => {

                return {
                    nome: sub.nome,
                    tarefas: sub.tarefas.filter(task => {

                        const matchTexto = task.nome.toLowerCase().includes(texto);
                        const matchData = !dataFiltro || task.inicio === dataFiltro;

                        return matchTexto && matchData;
                    })

                };

            }).filter(sub => sub.tarefas.length > 0)
        };

    }).filter(bloco => bloco.subcategorias.length > 0);

    render(filtrado);
}

</script>

</body>
</html>
